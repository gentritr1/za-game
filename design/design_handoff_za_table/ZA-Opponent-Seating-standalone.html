document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

U+037A-037F, U+0384-038A, U+038C, U+038E-03A1, U+03A3-03FF;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Press Start 2P';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"13728511-3c30-4bad-9f69-59d5e4103910\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Press Start 2P';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"c4b6cd10-b84a-43fd-b09e-3cfc0acde81a\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'VT323';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"3a6b2d75-4682-4beb-b228-ba7316133bca\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'VT323';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"4a88316f-71c7-4b97-9548-cb17ab695f08\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'VT323';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"9df00f86-5142-4e81-9ccc-92c29ec886b7\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  html,body{margin:0;padding:0;background:#080a12}\n  *{box-sizing:border-box}\n  a{color:#7de2ff;text-decoration:none;border-bottom:2px solid #2a3355}\n  a:hover{color:#ffe14d;border-bottom-color:#ffe14d}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<section style=\"display:flex;flex-direction:column;gap:56px;padding:56px 48px 96px;background:#080a12;color:#e8ecff;font-family:'VT323',monospace;font-size:20px;line-height:1.35\">\n\n  <div style=\"display:flex;flex-direction:column;gap:16px;max-width:1180px\">\n    <span style=\"font-size:19px;letter-spacing:.2em;color:#7de2ff\">TURN 2 — OPPONENT SEATING · WHOSE TURN, AND WHO IS AFTER THEM<\u002Fspan>\n    <span style=\"font-family:'Press Start 2P',monospace;font-size:38px;line-height:1.3;color:#ffe14d;text-shadow:5px 5px 0 #ff2e6b,10px 10px 0 rgba(0,0,0,.6)\">THE ROW IS ALREADY A QUEUE.<br>NOBODY READS IT.<\u002Fspan>\n    <p style=\"margin:8px 0 0;color:#a9b4d8;text-wrap:pretty;max-width:1080px\">The client already sorts opponents from the player after you and already reverses on a Flip the Pie. The order is correct and the visual language throws it away, because a row of equal panels reads as a roster. Three answers below. Every board is drawn at true pixel width, and every one of them is running — the turn advances every 2.4 seconds and the direction reverses every seventh turn, on a clock all nine boards share.<\u002Fp>\n    <div style=\"display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;font-size:19px;letter-spacing:.1em;color:#96a3c9\">\n      <span style=\"padding:8px 14px;border:3px solid #ffe14d;background:#101426;color:#ffe14d\"><a href=\"#2a\" style=\"color:inherit;border:none\">2A<\u002Fa> — THE COUNTER · BUILDING<\u002Fspan>\n      <span style=\"padding:8px 14px;border:3px solid #7de2ff;background:#101426;color:#7de2ff\"><a href=\"#2b\" style=\"color:inherit;border:none\">2B<\u002Fa> — THE QUEUE · MOBILE MODE<\u002Fspan>\n      <span style=\"padding:8px 14px;border:3px solid #2a3355;background:#101426;color:#6d7699\"><a href=\"#2c\" style=\"color:inherit;border:none\">2C<\u002Fa> — THE LAZY SUSAN · NOT BUILDING<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;flex-direction:column;gap:20px;max-width:1180px;padding:26px 30px;background:#101426;border:4px solid #ffe14d;box-shadow:8px 8px 0 rgba(0,0,0,.6)\">\n    <span style=\"font-family:'Press Start 2P',monospace;font-size:16px;color:#ffe14d\">DECIDED: <a href=\"#2a\" style=\"color:#ffe14d;border:none\">2A<\u002Fa> THE COUNTER, WITH <a href=\"#2b\" style=\"color:#ffe14d;border:none\">2B<\u002Fa> AS ITS MOBILE MODE<\u002Fspan>\n    <p style=\"margin:0;color:#c3cceb;text-wrap:pretty\">It is the only one of the three where turn order costs nothing to read, because it is furniture rather than a label. It is also the only one where a fan of cards has anywhere to be: cards in front of people needs the people to be somewhere. It deletes code — the row stops re-sorting on a reverse, the hard swap goes, and the marquee hands its five chevrons back as width for the turn text. And <a href=\"#2b\">2B<\u002Fa> is not wasted work, because it is what 375px gets in all three cases.<\u002Fp>\n    <p style=\"margin:0;color:#8f9bc4;text-wrap:pretty\"><a href=\"#2c\">2C<\u002Fa> is the most fun for ten seconds and the most tiring for ten minutes. It trades knowing <em style=\"color:#c3cceb;font-style:normal\">who<\u002Fem> for knowing <em style=\"color:#c3cceb;font-style:normal\">where<\u002Fem>, and who is the thing a player actually tracks.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;flex-direction:column;gap:26px\">\n    <div style=\"display:flex;flex-direction:column;gap:10px;max-width:1180px\">\n      <span style=\"font-family:'Press Start 2P',monospace;font-size:20px;color:#ffe14d\">SHARED — WHAT EVERY DIRECTION USES<\u002Fspan>\n      <p style=\"margin:0;color:#a9b4d8;text-wrap:pretty\">One seat component, one card object, one set of weights. Only the arrangement is up for debate; steps 1 to 4 of the handoff are the same whichever direction wins.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:12px\">\n      <span style=\"font-size:19px;letter-spacing:.16em;color:#7de2ff\">FOUR SEAT STATES, SIDE BY SIDE. NOW IS ENCLOSED; NEXT IS ONE EDGE. NOT TWO BRIGHTNESSES OF THE SAME SHAPE.<\u002Fspan>\n      <div style=\"width:1760px;height:350px;overflow:hidden;border:3px solid #2a3355;box-shadow:8px 8px 0 rgba(0,0,0,.6);flex:none\">\n        <dc-import name=\"ZA Table\" part=\"states\" w=\"1760\" live=\"{{ false }}\" hint-size=\"100%,350px\"><\u002Fdc-import>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:12px\">\n      <span style=\"font-size:19px;letter-spacing:.16em;color:#7de2ff\">A HAND OF 1, 3, 7 AND 14 AS A PHYSICAL OBJECT. THE FAN STOPS WORKING AT EIGHT.<\u002Fspan>\n      <div style=\"width:1760px;height:350px;overflow:hidden;border:3px solid #2a3355;box-shadow:8px 8px 0 rgba(0,0,0,.6);flex:none\">\n        <dc-import name=\"ZA Table\" part=\"ladder\" w=\"1760\" live=\"{{ false }}\" hint-size=\"100%,350px\"><\u002Fdc-import>\n      <\u002Fdiv>\n      <p style=\"margin:0;max-width:1180px;color:#8f9bc4;text-wrap:pretty\">The pizza box stays and gains a job: it is the tray the fan stands in, and the two-digit count is printed on its front, so the object and the numeral are one element rather than two competing ones. Lid angle is the shipped map — seven or more wide open at -62°, one card all but shut at -6°.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"2a\" style=\"display:flex;flex-direction:column;gap:28px;padding-top:12px;border-top:4px solid #2a3355\">\n    <div style=\"display:flex;flex-direction:column;gap:12px;max-width:1180px\">\n      <div style=\"display:flex;align-items:center;gap:14px\">\n        <span style=\"font-family:'Press Start 2P',monospace;font-size:18px;padding:10px 14px;background:#ffe14d;color:#0d0f1a;box-shadow:4px 4px 0 rgba(0,0,0,.6)\">2A<\u002Fspan>\n        <span style=\"font-family:'Press Start 2P',monospace;font-size:26px;color:#ffe14d\">THE COUNTER<\u002Fspan>\n        <span style=\"font-size:19px;letter-spacing:.14em;color:#3ddc7f;padding:7px 12px;border:3px solid #3ddc7f\">RECOMMENDED<\u002Fspan>\n      <\u002Fdiv>\n      <p style=\"margin:0;color:#a9b4d8;text-wrap:pretty\">The round table, drawn square, because zero border-radius is a house rule and a square counter is more pizzeria anyway. Chefs sit around three dashed sides; the near edge is open, which is where your hand already is. Turn order is <em style=\"font-style:normal;color:#c3cceb\">where people are sitting<\u002Fem>. Direction is a chevron token that walks the counter from the chef playing to the chef next. Nothing re-sorts, ever.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:12px\">\n      <span style=\"font-size:19px;letter-spacing:.16em;color:#7de2ff\">1280 — FOUR PLAYERS. LIVE: THE RING MOVES, THE TOKEN WALKS, THE TABLE HOLDS STILL.<\u002Fspan>\n      <div style=\"width:1280px;height:720px;overflow:hidden;border:3px solid #2a3355;box-shadow:8px 8px 0 rgba(0,0,0,.6);flex:none\">\n        <dc-import name=\"ZA Table\" w=\"1280\" n=\"4\" kind=\"arc\" hint-size=\"100%,720px\"><\u002Fdc-import>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:12px\">\n      <span style=\"font-size:19px;letter-spacing:.16em;color:#7de2ff\">2400 — THE CAP HOLDS AT 1900 AND THE COUNTER STAYS INSIDE IT. THE CABINET IS UNTOUCHED.<\u002Fspan>\n      <div style=\"width:1760px;height:990px;overflow:hidden;border:3px solid #2a3355;box-shadow:8px 8px 0 rgba(0,0,0,.6);flex:none\">\n        <div style=\"width:2400px;height:1350px;transform:scale(.73333);transform-origin:0 0\">\n          <dc-import name=\"ZA Table\" live=\"{{ false }}\" t=\"4\" w=\"2400\" n=\"6\" kind=\"arc\" hint-size=\"100%,1350px\"><\u002Fdc-import>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:12px\">\n      <span style=\"font-size:19px;letter-spacing:.16em;color:#7de2ff\">2, 4 AND 8 PLAYERS AT 1280. ONE OPPONENT SITS OPPOSITE YOU ACROSS THE OVEN — DELIBERATE, NOT BROKEN.<\u002Fspan>\n      <div style=\"display:flex;gap:24px;flex-wrap:wrap\">\n        <div style=\"width:563px;height:317px;overflow:hidden;border:3px solid #2a3355;flex:none\"><div style=\"width:1280px;height:720px;transform:scale(.44);transform-origin:0 0\"><dc-import name=\"ZA Table\" live=\"{{ false }}\" t=\"4\" w=\"1280\" n=\"2\" kind=\"arc\" hint-size=\"100%,720px\"><\u002Fdc-import><\u002Fdiv><\u002Fdiv>\n        <div style=\"width:563px;height:317px;overflow:hidden;border:3px solid #2a3355;flex:none\"><div style=\"width:1280px;height:720px;transform:scale(.44);transform-origin:0 0\"><dc-import name=\"ZA Table\" live=\"{{ false }}\" t=\"4\" w=\"1280\" n=\"4\" kind=\"arc\" hint-size=\"100%,720px\"><\u002Fdc-import><\u002Fdiv><\u002Fdiv>\n        <div style=\"width:563px;height:317px;overflow:hidden;border:3px solid #2a3355;flex:none\"><div style=\"width:1280px;height:720px;transform:scale(.44);transform-origin:0 0\"><dc-import name=\"ZA Table\" live=\"{{ false }}\" t=\"4\" w=\"1280\" n=\"8\" kind=\"arc\" hint-size=\"100%,720px\"><\u002Fdc-import><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:12px\">\n      <span style=\"font-size:19px;letter-spacing:.16em;color:#ff2e6b\">THE CALL-OUT WINDOW. PINA IS ON ONE CARD AND IT IS NOT HER TURN.<\u002Fspan>\n      <div style=\"width:1280px;height:720px;overflow:hidden;border:3px solid #ff2e6b;box-shadow:8px 8px 0 rgba(0,0,0,.6);flex:none\">\n        <dc-import name=\"ZA Table\" w=\"1280\" n=\"6\" kind=\"arc\" moment=\"callout\" live=\"{{ false }}\" hint-size=\"100%,720px\"><\u002Fdc-import>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;gap:24px;flex-wrap:wrap;max-width:1760px\">\n      <div style=\"flex:1 1 380px;min-width:340px;display:flex;flex-direction:column;gap:9px;padding:20px 22px;background:#101426;border:3px solid #2a3355\">\n        <span style=\"font-family:'Press Start 2P',monospace;font-size:13px;color:#ffe14d\">THE HANDOFF · 240MS<\u002Fspan>\n        <p style=\"margin:0;color:#a9b4d8;text-wrap:pretty\">The ring fades off the old seat and onto the new one, 130ms each way on steps(2, end). The token walks one gap on steps(4, end). One sliver leaves the played hand and the lid steps one notch shut. The counter, the oven, the pit and every other seat do not move at all.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex:1 1 380px;min-width:340px;display:flex;flex-direction:column;gap:9px;padding:20px 22px;background:#101426;border:3px solid #2a3355\">\n        <span style=\"font-family:'Press Start 2P',monospace;font-size:13px;color:#ffe14d\">THE REVERSE<\u002Fspan>\n        <p style=\"margin:0;color:#a9b4d8;text-wrap:pretty\">The token turns around and walks the other way. That is the whole event. Seats never move, because a real table does not re-seat itself when play turns around — you simply read it the other way. This deletes the hard swap in <span style=\"color:#7de2ff\">renderOpponents<\u002Fspan> and the reversal in <span style=\"color:#7de2ff\">orderedOpponents<\u002Fspan>.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex:1 1 380px;min-width:340px;display:flex;flex-direction:column;gap:9px;padding:20px 22px;background:#101426;border:3px solid #ff2e6b\">\n        <span style=\"font-family:'Press Start 2P',monospace;font-size:13px;color:#ff2e6b\">THE COST<\u002Fspan>\n        <p style=\"margin:0;color:#a9b4d8;text-wrap:pretty\">At eight the arc pushes chefs onto the side walls and the portrait drops to 46px. The seat map is hand-authored per count rather than computed, which is seven short arrays to maintain. And it does not survive 375px — it hands over to <a href=\"#2b\">2B<\u002Fa>.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"2b\" style=\"display:flex;flex-direction:column;gap:28px;padding-top:12px;border-top:4px solid #2a3355\">\n    <div style=\"display:flex;flex-direction:column;gap:12px;max-width:1180px\">\n      <div style=\"display:flex;align-items:center;gap:14px\">\n        <span style=\"font-family:'Press Start 2P',monospace;font-size:18px;padding:10px 14px;background:#7de2ff;color:#0d0f1a;box-shadow:4px 4px 0 rgba(0,0,0,.6)\">2B<\u002Fspan>\n        <span style=\"font-family:'Press Start 2P',monospace;font-size:26px;color:#7de2ff\">THE QUEUE<\u002Fspan>\n      <\u002Fdiv>\n      <p style=\"margin:0;color:#a9b4d8;text-wrap:pretty\">Abandon seating entirely and make the order the layout: left to right <em style=\"font-style:normal;color:#c3cceb\">is<\u002Fem> the order of play. NOW at the head, NEXT beside it, then 03, 04, 05. Every chef carries an ordinal chip, so the position states it and the word confirms it. On the turn the strip advances one slot and a conveyor belt underneath scrolls in the direction of play.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:12px\">\n      <span style=\"font-size:19px;letter-spacing:.16em;color:#7de2ff\">1280 — SIX PLAYERS. THE HEAD OF THE QUEUE IS A FIXED PLACE; THE CHEFS MOVE THROUGH IT.<\u002Fspan>\n      <div style=\"width:1280px;height:720px;overflow:hidden;border:3px solid #2a3355;box-shadow:8px 8px 0 rgba(0,0,0,.6);flex:none\">\n        <dc-import name=\"ZA Table\" w=\"1280\" n=\"6\" kind=\"queue\" hint-size=\"100%,720px\"><\u002Fdc-import>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:12px\">\n      <span style=\"font-size:19px;letter-spacing:.16em;color:#7de2ff\">2400 — THE STRIP DOES NOT INFLATE. IT GAINS AIR AND THE FANS GAIN SIZE.<\u002Fspan>\n      <div style=\"width:1760px;height:990px;overflow:hidden;border:3px solid #2a3355;box-shadow:8px 8px 0 rgba(0,0,0,.6);flex:none\">\n        <div style=\"width:2400px;height:1350px;transform:scale(.73333);transform-origin:0 0\">\n          <dc-import name=\"ZA Table\" live=\"{{ false }}\" t=\"4\" w=\"2400\" n=\"8\" kind=\"queue\" hint-size=\"100%,1350px\"><\u002Fdc-import>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:12px\">\n      <span style=\"font-size:19px;letter-spacing:.16em;color:#7de2ff\">2, 4 AND 8 PLAYERS AT 1280.<\u002Fspan>\n      <div style=\"display:flex;gap:24px;flex-wrap:wrap\">\n        <div style=\"width:563px;height:317px;overflow:hidden;border:3px solid #2a3355;flex:none\"><div style=\"width:1280px;height:720px;transform:scale(.44);transform-origin:0 0\"><dc-import name=\"ZA Table\" live=\"{{ false }}\" t=\"4\" w=\"1280\" n=\"2\" kind=\"queue\" hint-size=\"100%,720px\"><\u002Fdc-import><\u002Fdiv><\u002Fdiv>\n        <div style=\"width:563px;height:317px;overflow:hidden;border:3px solid #2a3355;flex:none\"><div style=\"width:1280px;height:720px;transform:scale(.44);transform-origin:0 0\"><dc-import name=\"ZA Table\" live=\"{{ false }}\" t=\"4\" w=\"1280\" n=\"4\" kind=\"queue\" hint-size=\"100%,720px\"><\u002Fdc-import><\u002Fdiv><\u002Fdiv>\n        <div style=\"width:563px;height:317px;overflow:hidden;border:3px solid #2a3355;flex:none\"><div style=\"width:1280px;height:720px;transform:scale(.44);transform-origin:0 0\"><dc-import name=\"ZA Table\" live=\"{{ false }}\" t=\"4\" w=\"1280\" n=\"8\" kind=\"queue\" hint-size=\"100%,720px\"><\u002Fdc-import><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;gap:24px;flex-wrap:wrap;max-width:1760px\">\n      <div style=\"flex:1 1 380px;min-width:340px;display:flex;flex-direction:column;gap:9px;padding:20px 22px;background:#101426;border:3px solid #2a3355\">\n        <span style=\"font-family:'Press Start 2P',monospace;font-size:13px;color:#7de2ff\">THE HANDOFF · 240MS<\u002Fspan>\n        <p style=\"margin:0;color:#a9b4d8;text-wrap:pretty\">The strip advances exactly one slot on steps(3, end) and the chef who just played wraps to the tail. The head of the queue is a fixed place on the screen, so your eye never travels. The chips renumber on the frame the slide lands, with no tween — an ordinal that counts down is a lie about what happened. The oven, the pit and the marquee do not move.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex:1 1 380px;min-width:340px;display:flex;flex-direction:column;gap:9px;padding:20px 22px;background:#101426;border:3px solid #2a3355\">\n        <span style=\"font-family:'Press Start 2P',monospace;font-size:13px;color:#7de2ff\">THE REVERSE<\u002Fspan>\n        <p style=\"margin:0;color:#a9b4d8;text-wrap:pretty\">The belt scrolls the other way and the tail of the queue re-forms behind the head: a hard swap on steps(2, end), 200ms, no tween. This is the same event the current row already does badly — the difference is that a queue re-forming is a thing a queue is allowed to do, where a row of seats shuffling is not.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex:1 1 380px;min-width:340px;display:flex;flex-direction:column;gap:9px;padding:20px 22px;background:#101426;border:3px solid #ff2e6b\">\n        <span style=\"font-family:'Press Start 2P',monospace;font-size:13px;color:#ff2e6b\">THE COST<\u002Fspan>\n        <p style=\"margin:0;color:#a9b4d8;text-wrap:pretty\">Identity moves. It is the best answer on the page to \"who is next\" and the worst to \"where is Pina, and how many has she got\" — she is in a different slot every single turn. It never becomes a table either: the card fans are doing all the charm on their own. At two players a queue of one reads as a mistake in a way that a chef sitting opposite you does not.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"2c\" style=\"display:flex;flex-direction:column;gap:28px;padding-top:12px;border-top:4px solid #2a3355\">\n    <div style=\"display:flex;flex-direction:column;gap:12px;max-width:1180px\">\n      <div style=\"display:flex;align-items:center;gap:14px\">\n        <span style=\"font-family:'Press Start 2P',monospace;font-size:18px;padding:10px 14px;background:#3ddc7f;color:#0d0f1a;box-shadow:4px 4px 0 rgba(0,0,0,.6)\">2C<\u002Fspan>\n        <span style=\"font-family:'Press Start 2P',monospace;font-size:26px;color:#3ddc7f\">THE LAZY SUSAN<\u002Fspan>\n      <\u002Fdiv>\n      <p style=\"margin:0;color:#a9b4d8;text-wrap:pretty\">The seats ride a turntable and the live seat is always the station at twelve o'clock. The bracket is painted on the board rather than on the chef: the highlight belongs to the table, and \"whose turn\" becomes a place you learn once. You are on the ring too, because a ring that leaves you off is not the turn order.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:12px\">\n      <span style=\"font-size:19px;letter-spacing:.16em;color:#7de2ff\">1280 — SIX PLAYERS. THE PLATE TURNS 60° PER TURN; THE PORTRAITS COUNTER-TURN AND STAY UPRIGHT.<\u002Fspan>\n      <div style=\"width:1280px;height:720px;overflow:hidden;border:3px solid #2a3355;box-shadow:8px 8px 0 rgba(0,0,0,.6);flex:none\">\n        <dc-import name=\"ZA Table\" w=\"1280\" n=\"6\" kind=\"susan\" hint-size=\"100%,720px\"><\u002Fdc-import>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:12px\">\n      <span style=\"font-size:19px;letter-spacing:.16em;color:#7de2ff\">2400 — THE RING TAKES THE ROOM THE CABINET CAP WAS PROTECTING.<\u002Fspan>\n      <div style=\"width:1760px;height:990px;overflow:hidden;border:3px solid #2a3355;box-shadow:8px 8px 0 rgba(0,0,0,.6);flex:none\">\n        <div style=\"width:2400px;height:1350px;transform:scale(.73333);transform-origin:0 0\">\n          <dc-import name=\"ZA Table\" live=\"{{ false }}\" t=\"4\" w=\"2400\" n=\"8\" kind=\"susan\" hint-size=\"100%,1350px\"><\u002Fdc-import>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:12px\">\n      <span style=\"font-size:19px;letter-spacing:.16em;color:#7de2ff\">2, 4 AND 8 PLAYERS AT 1280. AT TWO IT IS A RING OF TWO, WHICH IS A SEE-SAW.<\u002Fspan>\n      <div style=\"display:flex;gap:24px;flex-wrap:wrap\">\n        <div style=\"width:563px;height:317px;overflow:hidden;border:3px solid #2a3355;flex:none\"><div style=\"width:1280px;height:720px;transform:scale(.44);transform-origin:0 0\"><dc-import name=\"ZA Table\" live=\"{{ false }}\" t=\"4\" w=\"1280\" n=\"2\" kind=\"susan\" hint-size=\"100%,720px\"><\u002Fdc-import><\u002Fdiv><\u002Fdiv>\n        <div style=\"width:563px;height:317px;overflow:hidden;border:3px solid #2a3355;flex:none\"><div style=\"width:1280px;height:720px;transform:scale(.44);transform-origin:0 0\"><dc-import name=\"ZA Table\" live=\"{{ false }}\" t=\"4\" w=\"1280\" n=\"4\" kind=\"susan\" hint-size=\"100%,720px\"><\u002Fdc-import><\u002Fdiv><\u002Fdiv>\n        <div style=\"width:563px;height:317px;overflow:hidden;border:3px solid #2a3355;flex:none\"><div style=\"width:1280px;height:720px;transform:scale(.44);transform-origin:0 0\"><dc-import name=\"ZA Table\" live=\"{{ false }}\" t=\"4\" w=\"1280\" n=\"8\" kind=\"susan\" hint-size=\"100%,720px\"><\u002Fdc-import><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;gap:24px;flex-wrap:wrap;max-width:1760px\">\n      <div style=\"flex:1 1 380px;min-width:340px;display:flex;flex-direction:column;gap:9px;padding:20px 22px;background:#101426;border:3px solid #2a3355\">\n        <span style=\"font-family:'Press Start 2P',monospace;font-size:13px;color:#3ddc7f\">THE HANDOFF · 300MS<\u002Fspan>\n        <p style=\"margin:0;color:#a9b4d8;text-wrap:pretty\">The ring turns 360/n on steps(4, end) — four visible frames, no glide. Portraits counter-turn by the same amount on the same easing, so a face never tilts. The brackets, the oven and the pit are painted on the board and do not participate.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex:1 1 380px;min-width:340px;display:flex;flex-direction:column;gap:9px;padding:20px 22px;background:#101426;border:3px solid #2a3355\">\n        <span style=\"font-family:'Press Start 2P',monospace;font-size:13px;color:#3ddc7f\">THE REVERSE<\u002Fspan>\n        <p style=\"margin:0;color:#a9b4d8;text-wrap:pretty\">The strongest reverse of the three, and the only reason to keep this direction alive: the plate stops and turns back. It is physical, it is unmistakable, and it needs no glyph, no colour change and no word. If we drop 2C, this is the thing worth stealing.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex:1 1 380px;min-width:340px;display:flex;flex-direction:column;gap:9px;padding:20px 22px;background:#101426;border:3px solid #ff2e6b\">\n        <span style=\"font-family:'Press Start 2P',monospace;font-size:13px;color:#ff2e6b\">THE COST<\u002Fspan>\n        <p style=\"margin:0;color:#a9b4d8;text-wrap:pretty\">A chef is never twice in the same place, so \"where is Pina, and how many has she got\" is a fresh search every single turn. On your own turn your marker is at twelve o'clock while your hand is at the bottom of the screen, which splits your attention at the worst moment. At eight the ring eats the felt the cabinet cap exists to protect, and it does not survive 375px at all.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;flex-direction:column;gap:24px;padding-top:12px;border-top:4px solid #2a3355\">\n    <div style=\"display:flex;flex-direction:column;gap:12px;max-width:1180px\">\n      <span style=\"font-family:'Press Start 2P',monospace;font-size:20px;color:#ffe14d\">375PX — THE COUNTER HANDS OVER TO THE QUEUE<\u002Fspan>\n      <p style=\"margin:0;color:#a9b4d8;text-wrap:pretty\">The counter does not survive a phone, and pretending otherwise is how the current row ended up wrapping. Below 520px <a href=\"#2a\">2A<\u002Fa> hands over to <a href=\"#2b\">2B<\u002Fa> — one breakpoint, said plainly rather than quietly assumed. The head of the queue takes a 58px portrait and a full fan; the tail drops to 34px and only has to say who and how many. The strip keeps a dashed lip along its top, which is the counter's own edge seen from closer up, so the two modes read as the same game rather than two different ones.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:28px;align-items:flex-start;flex-wrap:wrap\">\n      <div style=\"width:375px;height:812px;overflow:hidden;border:3px solid #2a3355;box-shadow:8px 8px 0 rgba(0,0,0,.6);flex:none\">\n        <dc-import name=\"ZA Table\" w=\"375\" n=\"4\" kind=\"arc\" live=\"{{ false }}\" t=\"4\" hint-size=\"100%,812px\"><\u002Fdc-import>\n      <\u002Fdiv>\n      <div style=\"width:375px;height:812px;overflow:hidden;border:3px solid #ff2e6b;box-shadow:8px 8px 0 rgba(0,0,0,.6);flex:none\">\n        <dc-import name=\"ZA Table\" w=\"375\" n=\"8\" kind=\"arc\" moment=\"callout\" live=\"{{ false }}\" hint-size=\"100%,812px\"><\u002Fdc-import>\n      <\u002Fdiv>\n      <div style=\"flex:1 1 420px;min-width:380px;display:flex;flex-direction:column;gap:16px\">\n        <div style=\"display:flex;flex-direction:column;gap:9px;padding:20px 22px;background:#101426;border:3px solid #2a3355\">\n          <span style=\"font-family:'Press Start 2P',monospace;font-size:13px;color:#7de2ff\">WHAT THE PHONE KEEPS<\u002Fspan>\n          <p style=\"margin:0;color:#a9b4d8;text-wrap:pretty\">The ordinal chips, the fan, the belt, the enclosed/one-edge distinction, and the seat as the call-out button. What it drops: the pizza box under 40px, and the counter itself.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:9px;padding:20px 22px;background:#101426;border:3px solid #ff2e6b\">\n          <span style=\"font-family:'Press Start 2P',monospace;font-size:13px;color:#ff2e6b\">THE SEAT IS THE CALL-OUT BUTTON<\u002Fspan>\n          <p style=\"margin:0;color:#a9b4d8;text-wrap:pretty\">A chef in <span style=\"color:#7de2ff\">calloutTargets<\u002Fspan> becomes a pressable target: sauce ring, the single card stood upright and pulsing, and a press that sends <span style=\"color:#7de2ff\">callout<\u002Fspan> with their id. The button in the hand zone stays for keyboard and for screen readers — it is the same handler, reached two ways. On a phone the seat is a 44px target before the fan is counted.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:9px;padding:20px 22px;background:#101426;border:3px solid #3ddc7f\">\n          <span style=\"font-family:'Press Start 2P',monospace;font-size:13px;color:#3ddc7f\">NOTHING NEW IS NEEDED FROM THE SERVER<\u002Fspan>\n          <p style=\"margin:0;color:#a9b4d8;text-wrap:pretty\">Every state above comes off the snapshot the client already receives: <span style=\"color:#7de2ff\">players[]<\u002Fspan> with name, isBot, connected, cardCount, declaredZa and vulnerable, plus turnPlayerId, direction and calloutTargets. One client-side behaviour change is requested, and it is a deletion: <span style=\"color:#7de2ff\">orderedOpponents()<\u002Fspan> stops reversing on a Flip the Pie. No new art is required either — the six regulars and the card back cover it.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fsection>\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
