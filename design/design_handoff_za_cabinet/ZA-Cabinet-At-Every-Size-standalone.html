document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n  <style>\n    *, *::before, *::after { box-sizing: border-box; }\n    body { margin: 0; background: #07080f; }\n    a { color: #7de2ff; text-decoration: none; border-bottom: 2px solid #2a3355; }\n    a:hover { color: #ffe14d; border-bottom-color: #ffe14d; }\n    @keyframes za-chase { 0%, 40% { opacity: 1; } 41%, 100% { opacity: .18; } }\n    @keyframes za-breathe { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }\n    @media (prefers-reduced-motion: reduce) {\n      * { animation: none !important; }\n    }\n  <\u002Fstyle>\n  \n<\u002Fhelmet>\n\n<section style=\"display:flex;flex-direction:column;gap:34px;padding:56px;background:#07080f;color:#e8ecff;font-family:'VT323',monospace\">\n\n  <div style=\"display:flex;flex-direction:column;gap:14px;max-width:980px\">\n    <span style=\"font-family:'VT323',monospace;font-size:19px;letter-spacing:.2em;color:#7de2ff\">TURN 1 — THE CABINET AT EVERY SIZE · HUD + SCALE<\u002Fspan>\n    <span style=\"font-family:'Press Start 2P',monospace;font-size:40px;line-height:1.2;color:#ffe14d;text-shadow:5px 5px 0 #ff2e6b,10px 10px 0 rgba(0,0,0,.6)\">WHAT THE ROOM IS FOR<\u002Fspan>\n    <p style=\"margin:6px 0 0;font-size:22px;line-height:1.4;color:#a9b4d8;text-wrap:pretty;max-width:820px\">Three answers to the same 27-inch problem, each carrying its own marquee. Every board below is drawn at its true pixel width and scaled to fit this column, so the density you see is the density you get. Notches are unchanged: cards 84 / 100 / 116, base type 18 / 20 / 22. The playfield cap is 1900px.<\u002Fp>\n    <div style=\"display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;font-size:19px;letter-spacing:.1em;color:#96a3c9\">\n      <span style=\"padding:6px 12px;border:3px solid #2a3355;background:#101426\"><a href=\"#1a\">1A<\u002Fa> — THE LITERAL CABINET<\u002Fspan>\n      <span style=\"padding:6px 12px;border:3px solid #2a3355;background:#101426\"><a href=\"#1b\">1B<\u002Fa> — THE TABLE GROWS<\u002Fspan>\n      <span style=\"padding:6px 12px;border:3px solid #2a3355;background:#101426\"><a href=\"#1c\">1C<\u002Fa> — SPECTATOR FURNITURE<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;gap:48px;align-items:flex-start;flex-wrap:wrap\">\n\n    <!-- ============================== 1A ============================== -->\n    <div id=\"1a\" style=\"display:flex;flex-direction:column;gap:26px;width:1120px;flex:none\">\n      <div style=\"display:flex;flex-direction:column;gap:10px\">\n        <div style=\"display:flex;align-items:center;gap:14px\">\n          <span style=\"font-family:'Press Start 2P',monospace;font-size:15px;padding:10px 13px;background:#ffe14d;color:#0d0f1a;box-shadow:4px 4px 0 rgba(0,0,0,.6)\">1A<\u002Fspan>\n          <span style=\"font-family:'Press Start 2P',monospace;font-size:20px;color:#e8ecff;letter-spacing:.02em\">THE LITERAL CABINET<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin:0;font-size:21px;line-height:1.4;color:#a9b4d8;max-width:1000px;text-wrap:pretty\">Past 1900px the game stops stretching and the pizzeria fills the rest. The playfield locks; side panels carry the vertical ZA! marquee, the wall of fame and the chalkboard special — the things that were competing for screen space now live on the furniture instead.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:8px\">\n        <span style=\"font-size:19px;letter-spacing:.16em;color:#7de2ff\">1280 — NO CABINET YET. THE BEZEL IS A RIM; THE MARQUEE IS THE HEADER.<\u002Fspan>\n        <div style=\"width:1120px;height:630px;overflow:hidden;border:3px solid #2a3355;flex:none;box-shadow:8px 8px 0 rgba(0,0,0,.6)\">\n          <div style=\"width:1280px;height:720px;transform:scale(.875);transform-origin:0 0\">\n            <dc-import name=\"ZA Board\" w=\"1280\" chrome=\"cabinet\" moment=\"{{ moment }}\" evt=\"none\" part=\"board\" hint-size=\"100%,100%\"><\u002Fdc-import>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:8px\">\n        <span style=\"font-size:19px;letter-spacing:.16em;color:#7de2ff\">1700 — NOTCH 2. STILL UNDER THE CAP, SO EVERYTHING SIMPLY STEPS UP.<\u002Fspan>\n        <div style=\"width:1120px;height:630px;overflow:hidden;border:3px solid #2a3355;flex:none;box-shadow:8px 8px 0 rgba(0,0,0,.6)\">\n          <div style=\"width:1700px;height:956px;transform:scale(.6588);transform-origin:0 0\">\n            <dc-import name=\"ZA Board\" w=\"1700\" chrome=\"cabinet\" moment=\"{{ moment }}\" evt=\"none\" part=\"board\" hint-size=\"100%,100%\"><\u002Fdc-import>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:8px\">\n        <span style=\"font-size:19px;letter-spacing:.16em;color:#ffe14d\">2400 — CAPPED AT 1900. 250PX OF CABINET EITHER SIDE.<\u002Fspan>\n        <div style=\"width:1120px;height:630px;overflow:hidden;border:3px solid #2a3355;flex:none;box-shadow:8px 8px 0 rgba(0,0,0,.6)\">\n          <div style=\"width:2400px;height:1350px;transform:scale(.4667);transform-origin:0 0\">\n            <dc-import name=\"ZA Board\" w=\"2400\" chrome=\"cabinet\" moment=\"{{ moment }}\" evt=\"none\" part=\"board\" hint-size=\"100%,100%\"><\u002Fdc-import>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:10px;padding-top:8px\">\n        <span style=\"font-family:'Press Start 2P',monospace;font-size:14px;color:#ffe14d\">THE MARQUEE — THREE MOMENTS<\u002Fspan>\n        <p style=\"margin:0;font-size:20px;line-height:1.35;color:#a9b4d8;max-width:1000px\">A framed strip in its own black bezel, the way a real header sits proud of the cabinet. Game name at left, turn state centred, direction as a five-chevron chase at right — the chase runs left-to-right on normal play and reverses on a flip, so direction never needs a word.<\u002Fp>\n        <div style=\"display:flex;flex-direction:column;gap:10px\">\n          <div style=\"width:1120px;height:106px;overflow:hidden;flex:none\"><div style=\"width:1700px;height:160px;transform:scale(.6588);transform-origin:0 0\"><dc-import name=\"ZA Board\" w=\"1700\" chrome=\"cabinet\" moment=\"you\" part=\"marquee\" hint-size=\"100%,100%\"><\u002Fdc-import><\u002Fdiv><\u002Fdiv>\n          <div style=\"width:1120px;height:106px;overflow:hidden;flex:none\"><div style=\"width:1700px;height:160px;transform:scale(.6588);transform-origin:0 0\"><dc-import name=\"ZA Board\" w=\"1700\" chrome=\"cabinet\" moment=\"wait\" part=\"marquee\" hint-size=\"100%,100%\"><\u002Fdc-import><\u002Fdiv><\u002Fdiv>\n          <div style=\"width:1120px;height:106px;overflow:hidden;flex:none\"><div style=\"width:1700px;height:160px;transform:scale(.6588);transform-origin:0 0\"><dc-import name=\"ZA Board\" w=\"1700\" chrome=\"cabinet\" moment=\"callout\" part=\"marquee\" hint-size=\"100%,100%\"><\u002Fdc-import><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:8px;padding:16px;background:#101426;border:3px solid #2a3355\">\n        <span style=\"font-family:'Press Start 2P',monospace;font-size:13px;color:#7de2ff\">UTILITIES — BOTTOM BEZEL SCREWS<\u002Fspan>\n        <p style=\"margin:0;font-size:20px;line-height:1.35;color:#a9b4d8\">Room code, sound and leave come off the top edge entirely and become three screw heads on the bezel rail under the hand: 19px head, slot angle per control, VT323 label beside it. Always visible, never loud, and they sit where nothing else competes.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:10px\">\n        <span style=\"font-family:'Press Start 2P',monospace;font-size:14px;color:#ffe14d\">WHAT THE CHROME DOES<\u002Fspan>\n        <div style=\"display:flex;gap:14px;flex-wrap:wrap\">\n          <div style=\"display:flex;flex-direction:column;gap:6px;width:546px\"><span style=\"font-size:19px;letter-spacing:.14em;color:#7de2ff\">CHAIN — THE HEAT CLIMBS AND THE TOTAL PLANTS ITSELF<\u002Fspan><div style=\"width:546px;height:307px;overflow:hidden;border:3px solid #2a3355;flex:none\"><div style=\"width:1280px;height:720px;transform:scale(.4266);transform-origin:0 0\"><dc-import name=\"ZA Board\" w=\"1280\" chrome=\"cabinet\" moment=\"you\" evt=\"chain\" part=\"board\" hint-size=\"100%,100%\"><\u002Fdc-import><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:6px;width:546px\"><span style=\"font-size:19px;letter-spacing:.14em;color:#7de2ff\">SHOUT — ZA! LANDS ACROSS THE GLASS<\u002Fspan><div style=\"width:546px;height:307px;overflow:hidden;border:3px solid #2a3355;flex:none\"><div style=\"width:1280px;height:720px;transform:scale(.4266);transform-origin:0 0\"><dc-import name=\"ZA Board\" w=\"1280\" chrome=\"cabinet\" moment=\"wait\" evt=\"za\" part=\"board\" hint-size=\"100%,100%\"><\u002Fdc-import><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:6px;width:546px\"><span style=\"font-size:19px;letter-spacing:.14em;color:#7de2ff\">WIN — THE CABINET PRINTS THE NAME<\u002Fspan><div style=\"width:546px;height:307px;overflow:hidden;border:3px solid #2a3355;flex:none\"><div style=\"width:2400px;height:1350px;transform:scale(.2275);transform-origin:0 0\"><dc-import name=\"ZA Board\" w=\"2400\" chrome=\"cabinet\" moment=\"wait\" evt=\"win\" part=\"board\" hint-size=\"100%,100%\"><\u002Fdc-import><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- ============================== 1B ============================== -->\n    <div id=\"1b\" style=\"display:flex;flex-direction:column;gap:26px;width:1120px;flex:none\">\n      <div style=\"display:flex;flex-direction:column;gap:10px\">\n        <div style=\"display:flex;align-items:center;gap:14px\">\n          <span style=\"font-family:'Press Start 2P',monospace;font-size:15px;padding:10px 13px;background:#3ddc7f;color:#0d0f1a;box-shadow:4px 4px 0 rgba(0,0,0,.6)\">1B<\u002Fspan>\n          <span style=\"font-family:'Press Start 2P',monospace;font-size:20px;color:#e8ecff;letter-spacing:.02em\">THE TABLE GROWS, NOT THE UI<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin:0;font-size:21px;line-height:1.4;color:#a9b4d8;max-width:1000px;text-wrap:pretty\">Chrome stays at notch sizes and the felt takes everything else. The oven goes from a 320px presence to 700px, spent cards drift out around its mouth, and the chef panels get 16px of air at 1280 and 64px at 2400. A table you look into, not a UI that inflates.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:8px\">\n        <span style=\"font-size:19px;letter-spacing:.16em;color:#7de2ff\">1280 — TIGHT. THE OVEN IS A CARD AND A LABEL.<\u002Fspan>\n        <div style=\"width:1120px;height:630px;overflow:hidden;border:3px solid #2a3355;flex:none;box-shadow:8px 8px 0 rgba(0,0,0,.6)\">\n          <div style=\"width:1280px;height:720px;transform:scale(.875);transform-origin:0 0\">\n            <dc-import name=\"ZA Board\" w=\"1280\" chrome=\"table\" moment=\"{{ moment }}\" evt=\"none\" part=\"board\" hint-size=\"100%,100%\"><\u002Fdc-import>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:8px\">\n        <span style=\"font-size:19px;letter-spacing:.16em;color:#7de2ff\">1700 — THE OVEN GAINS A FIELD AND THE SPENT CARDS ARRIVE.<\u002Fspan>\n        <div style=\"width:1120px;height:630px;overflow:hidden;border:3px solid #2a3355;flex:none;box-shadow:8px 8px 0 rgba(0,0,0,.6)\">\n          <div style=\"width:1700px;height:956px;transform:scale(.6588);transform-origin:0 0\">\n            <dc-import name=\"ZA Board\" w=\"1700\" chrome=\"table\" moment=\"{{ moment }}\" evt=\"none\" part=\"board\" hint-size=\"100%,100%\"><\u002Fdc-import>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:8px\">\n        <span style=\"font-size:19px;letter-spacing:.16em;color:#ffe14d\">2400 — NO CAP. THE HUD IS THE SAME SIZE; THE ROOM IS ALL FELT.<\u002Fspan>\n        <div style=\"width:1120px;height:630px;overflow:hidden;border:3px solid #2a3355;flex:none;box-shadow:8px 8px 0 rgba(0,0,0,.6)\">\n          <div style=\"width:2400px;height:1350px;transform:scale(.4667);transform-origin:0 0\">\n            <dc-import name=\"ZA Board\" w=\"2400\" chrome=\"table\" moment=\"{{ moment }}\" evt=\"none\" part=\"board\" hint-size=\"100%,100%\"><\u002Fdc-import>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:10px;padding-top:8px\">\n        <span style=\"font-family:'Press Start 2P',monospace;font-size:14px;color:#ffe14d\">THE MARQUEE — THREE MOMENTS<\u002Fspan>\n        <p style=\"margin:0;font-size:20px;line-height:1.35;color:#a9b4d8;max-width:1000px\">If the UI must not inflate, the marquee must not either. It caps at 720px and floats centred over the felt, with the chevron chase and a cheese underline rail that lights only on your turn. At 2400 it is an object on the table, not a bar across the top of the screen.<\u002Fp>\n        <div style=\"display:flex;flex-direction:column;gap:10px\">\n          <div style=\"width:1120px;height:96px;overflow:hidden;flex:none\"><div style=\"width:1700px;height:146px;transform:scale(.6588);transform-origin:0 0\"><dc-import name=\"ZA Board\" w=\"1700\" chrome=\"table\" moment=\"you\" part=\"marquee\" hint-size=\"100%,100%\"><\u002Fdc-import><\u002Fdiv><\u002Fdiv>\n          <div style=\"width:1120px;height:96px;overflow:hidden;flex:none\"><div style=\"width:1700px;height:146px;transform:scale(.6588);transform-origin:0 0\"><dc-import name=\"ZA Board\" w=\"1700\" chrome=\"table\" moment=\"wait\" part=\"marquee\" hint-size=\"100%,100%\"><\u002Fdc-import><\u002Fdiv><\u002Fdiv>\n          <div style=\"width:1120px;height:96px;overflow:hidden;flex:none\"><div style=\"width:1700px;height:146px;transform:scale(.6588);transform-origin:0 0\"><dc-import name=\"ZA Board\" w=\"1700\" chrome=\"table\" moment=\"callout\" part=\"marquee\" hint-size=\"100%,100%\"><\u002Fdc-import><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:8px;padding:16px;background:#101426;border:3px solid #2a3355\">\n        <span style=\"font-family:'Press Start 2P',monospace;font-size:13px;color:#7de2ff\">UTILITIES — CONSOLE LIP SCREWS<\u002Fspan>\n        <p style=\"margin:0;font-size:20px;line-height:1.35;color:#a9b4d8\">Same three screws, on the console lip below the hand. The top edge is left to the marquee alone, which is the point of this direction: one loud thing up there and nothing else.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:10px\">\n        <span style=\"font-family:'Press Start 2P',monospace;font-size:14px;color:#ffe14d\">WHAT THE CHROME DOES<\u002Fspan>\n        <div style=\"display:flex;gap:14px;flex-wrap:wrap\">\n          <div style=\"display:flex;flex-direction:column;gap:6px;width:546px\"><span style=\"font-size:19px;letter-spacing:.14em;color:#7de2ff\">CHAIN — THE OVEN GLOW DOUBLES<\u002Fspan><div style=\"width:546px;height:307px;overflow:hidden;border:3px solid #2a3355;flex:none\"><div style=\"width:1700px;height:956px;transform:scale(.3212);transform-origin:0 0\"><dc-import name=\"ZA Board\" w=\"1700\" chrome=\"table\" moment=\"you\" evt=\"chain\" part=\"board\" hint-size=\"100%,100%\"><\u002Fdc-import><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:6px;width:546px\"><span style=\"font-size:19px;letter-spacing:.14em;color:#7de2ff\">SHOUT — OVER THE FELT, NOT THE HUD<\u002Fspan><div style=\"width:546px;height:307px;overflow:hidden;border:3px solid #2a3355;flex:none\"><div style=\"width:1700px;height:956px;transform:scale(.3212);transform-origin:0 0\"><dc-import name=\"ZA Board\" w=\"1700\" chrome=\"table\" moment=\"wait\" evt=\"za\" part=\"board\" hint-size=\"100%,100%\"><\u002Fdc-import><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:6px;width:546px\"><span style=\"font-size:19px;letter-spacing:.14em;color:#7de2ff\">WIN — THE TABLE CLEARS TO THE OVEN<\u002Fspan><div style=\"width:546px;height:307px;overflow:hidden;border:3px solid #2a3355;flex:none\"><div style=\"width:2400px;height:1350px;transform:scale(.2275);transform-origin:0 0\"><dc-import name=\"ZA Board\" w=\"2400\" chrome=\"table\" moment=\"wait\" evt=\"win\" part=\"board\" hint-size=\"100%,100%\"><\u002Fdc-import><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- ============================== 1C ============================== -->\n    <div id=\"1c\" style=\"display:flex;flex-direction:column;gap:26px;width:1120px;flex:none\">\n      <div style=\"display:flex;flex-direction:column;gap:10px\">\n        <div style=\"display:flex;align-items:center;gap:14px\">\n          <span style=\"font-family:'Press Start 2P',monospace;font-size:15px;padding:10px 13px;background:#4d7dff;color:#0d0f1a;box-shadow:4px 4px 0 rgba(0,0,0,.6)\">1C<\u002Fspan>\n          <span style=\"font-family:'Press Start 2P',monospace;font-size:20px;color:#e8ecff;letter-spacing:.02em\">SPECTATOR FURNITURE<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin:0;font-size:21px;line-height:1.4;color:#a9b4d8;max-width:1000px;text-wrap:pretty\">The big screen is the one being watched. The log stops being a 250px sidebar and becomes a house column: the regulars' catchphrases as speech bubbles, and a receipt that prints during play. The playfield keeps its notch size; the room to its right is for the people not holding cards.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:8px\">\n        <span style=\"font-size:19px;letter-spacing:.16em;color:#7de2ff\">1280 — 268PX HOUSE COLUMN. BUBBLES ONLY, NO RECEIPT.<\u002Fspan>\n        <div style=\"width:1120px;height:630px;overflow:hidden;border:3px solid #2a3355;flex:none;box-shadow:8px 8px 0 rgba(0,0,0,.6)\">\n          <div style=\"width:1280px;height:720px;transform:scale(.875);transform-origin:0 0\">\n            <dc-import name=\"ZA Board\" w=\"1280\" chrome=\"spectator\" moment=\"{{ moment }}\" evt=\"none\" part=\"board\" hint-size=\"100%,100%\"><\u002Fdc-import>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:8px\">\n        <span style=\"font-size:19px;letter-spacing:.16em;color:#7de2ff\">1700 — 356PX. THE RECEIPT STARTS PRINTING.<\u002Fspan>\n        <div style=\"width:1120px;height:630px;overflow:hidden;border:3px solid #2a3355;flex:none;box-shadow:8px 8px 0 rgba(0,0,0,.6)\">\n          <div style=\"width:1700px;height:956px;transform:scale(.6588);transform-origin:0 0\">\n            <dc-import name=\"ZA Board\" w=\"1700\" chrome=\"spectator\" moment=\"{{ moment }}\" evt=\"none\" part=\"board\" hint-size=\"100%,100%\"><\u002Fdc-import>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:8px\">\n        <span style=\"font-size:19px;letter-spacing:.16em;color:#ffe14d\">2400 — 560PX. READABLE FROM A COUCH.<\u002Fspan>\n        <div style=\"width:1120px;height:630px;overflow:hidden;border:3px solid #2a3355;flex:none;box-shadow:8px 8px 0 rgba(0,0,0,.6)\">\n          <div style=\"width:2400px;height:1350px;transform:scale(.4667);transform-origin:0 0\">\n            <dc-import name=\"ZA Board\" w=\"2400\" chrome=\"spectator\" moment=\"{{ moment }}\" evt=\"none\" part=\"board\" hint-size=\"100%,100%\"><\u002Fdc-import>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:10px;padding-top:8px\">\n        <span style=\"font-family:'Press Start 2P',monospace;font-size:14px;color:#ffe14d\">THE MARQUEE — THREE MOMENTS<\u002Fspan>\n        <p style=\"margin:0;font-size:20px;line-height:1.35;color:#a9b4d8;max-width:1000px\">A broadcast bar: edge-to-edge, a LIVE dot beside the wordmark, and the direction chase carried on a dashed rail that runs the full width underneath — the one element a viewer can read at ten feet. The bar changes colour, never height, so a stream overlay cropped to it never reflows.<\u002Fp>\n        <div style=\"display:flex;flex-direction:column;gap:10px\">\n          <div style=\"width:1120px;height:96px;overflow:hidden;flex:none\"><div style=\"width:1700px;height:146px;transform:scale(.6588);transform-origin:0 0\"><dc-import name=\"ZA Board\" w=\"1700\" chrome=\"spectator\" moment=\"you\" part=\"marquee\" hint-size=\"100%,100%\"><\u002Fdc-import><\u002Fdiv><\u002Fdiv>\n          <div style=\"width:1120px;height:96px;overflow:hidden;flex:none\"><div style=\"width:1700px;height:146px;transform:scale(.6588);transform-origin:0 0\"><dc-import name=\"ZA Board\" w=\"1700\" chrome=\"spectator\" moment=\"wait\" part=\"marquee\" hint-size=\"100%,100%\"><\u002Fdc-import><\u002Fdiv><\u002Fdiv>\n          <div style=\"width:1120px;height:96px;overflow:hidden;flex:none\"><div style=\"width:1700px;height:146px;transform:scale(.6588);transform-origin:0 0\"><dc-import name=\"ZA Board\" w=\"1700\" chrome=\"spectator\" moment=\"callout\" part=\"marquee\" hint-size=\"100%,100%\"><\u002Fdc-import><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:8px;padding:16px;background:#101426;border:3px solid #2a3355\">\n        <span style=\"font-family:'Press Start 2P',monospace;font-size:13px;color:#7de2ff\">UTILITIES — BELOW THE BROADCAST FRAME<\u002Fspan>\n        <p style=\"margin:0;font-size:20px;line-height:1.35;color:#a9b4d8\">Screws again, on the bottom rail — and on this direction that matters twice over: nothing identifying the room should ever sit in the top strip a stream is cropping.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:10px\">\n        <span style=\"font-family:'Press Start 2P',monospace;font-size:14px;color:#ffe14d\">WHAT THE CHROME DOES<\u002Fspan>\n        <div style=\"display:flex;gap:14px;flex-wrap:wrap\">\n          <div style=\"display:flex;flex-direction:column;gap:6px;width:546px\"><span style=\"font-size:19px;letter-spacing:.14em;color:#7de2ff\">CHAIN — THE RECEIPT PRINTS THE RUN<\u002Fspan><div style=\"width:546px;height:307px;overflow:hidden;border:3px solid #2a3355;flex:none\"><div style=\"width:1700px;height:956px;transform:scale(.3212);transform-origin:0 0\"><dc-import name=\"ZA Board\" w=\"1700\" chrome=\"spectator\" moment=\"you\" evt=\"chain\" part=\"board\" hint-size=\"100%,100%\"><\u002Fdc-import><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:6px;width:546px\"><span style=\"font-size:19px;letter-spacing:.14em;color:#7de2ff\">SHOUT — THE BUBBLE IS THE EVENT<\u002Fspan><div style=\"width:546px;height:307px;overflow:hidden;border:3px solid #2a3355;flex:none\"><div style=\"width:1700px;height:956px;transform:scale(.3212);transform-origin:0 0\"><dc-import name=\"ZA Board\" w=\"1700\" chrome=\"spectator\" moment=\"wait\" evt=\"za\" part=\"board\" hint-size=\"100%,100%\"><\u002Fdc-import><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:6px;width:546px\"><span style=\"font-size:19px;letter-spacing:.14em;color:#7de2ff\">WIN — THE RECEIPT IS THE SCOREBOARD<\u002Fspan><div style=\"width:546px;height:307px;overflow:hidden;border:3px solid #2a3355;flex:none\"><div style=\"width:2400px;height:1350px;transform:scale(.2275);transform-origin:0 0\"><dc-import name=\"ZA Board\" w=\"2400\" chrome=\"spectator\" moment=\"wait\" evt=\"win\" part=\"board\" hint-size=\"100%,100%\"><\u002Fdc-import><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;flex-direction:column;gap:10px;max-width:1000px;padding:22px;background:#101426;border:3px solid #2a3355;margin-top:10px\">\n    <span style=\"font-family:'Press Start 2P',monospace;font-size:14px;color:#ffe14d\">WHAT HOLDS ACROSS ALL THREE<\u002Fspan>\n    <p style=\"margin:0;font-size:20px;line-height:1.4;color:#a9b4d8\">375px is untouched — the marquee still wraps to its own row and the pit rail is unchanged. Type never drops below 12px Press Start except card indices at 11px. The chevron chase is opacity only, stepped, and stops dead under reduced motion, where direction falls back to the static arrow that is there today. No rule, protocol or server change: every state above is derived from the snapshot the client already receives.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;moment&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;you&quot;,&quot;wait&quot;,&quot;callout&quot;],&quot;default&quot;:&quot;you&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Board state&quot;}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    return { moment: this.props.moment ?? 'you' };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
